name: Website

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@v5
      - name: Read repository stars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stars="$(gh api "repos/$GITHUB_REPOSITORY" --jq .stargazers_count)"
          echo "API_REFERENCE_GITHUB_STARS=$stars" >> "$GITHUB_ENV"
      - run: |
          pnpm docs:site
          pnpm devtools build \
            --root ../.. \
            --include "packages/devtools/src/internal/browser/{example-machine,*-example}.ts" \
            --out-dir ../../.data/api-reference-site/v4/devtools
        env:
          API_REFERENCE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .data/api-reference-site/v4

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
