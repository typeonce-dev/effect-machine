name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  pokemon-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/pokemon
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: examples/pokemon/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/pokemon/pnpm-lock.yaml
      - run: pnpm --dir ../.. install --frozen-lockfile
      - run: pnpm --dir ../.. build
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  platformer-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/platformer
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: examples/platformer/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/platformer/pnpm-lock.yaml
      - run: pnpm --dir ../.. install --frozen-lockfile
      - run: pnpm --dir ../.. build
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
